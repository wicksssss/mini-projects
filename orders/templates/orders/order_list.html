<!DOCTYPE html>
<html>
<head><title>Мої замовлення</title></head>
<body>
    <h1>Мої замовлення</h1>
    
    {% if orders %}
        {% for order in orders %}
            <div>
                <p>Замовлення №{{ order.id }}</p>
                <p>Статус: {{ order.status }}</p>
                <p>Сума: {{ order.total_price }}</p>
                <p>Дата: {{ order.created_at }}</p>
                <a href="/orders/{{ order.id }}/">Деталі</a>
            </div>
            <hr>
        {% endfor %}
    {% else %}
        <p>Замовлень немає</p>
    {% endif %}
    
    <a href="/cart/">Кошик</a>
</body>
</html>
